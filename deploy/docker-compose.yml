name: ais-tracker

# One compose file for both local development and production, split by profile.
#
#   Dev  — Postgres only, published on localhost for a host-run tracker binary:
#            docker compose up -d              (or: make compose-up)
#
#   Prod — full stack (one-shot migrator, tracker, postgres-exporter) on ganymede,
#          behind the shared Traefik of the infrastructure repo:
#            deploy/deploy.sh                  (wraps --profile prod)
#
# Both read the repo-root .env supplying POSTGRES_PASSWORD (required; see
# .env.example). Prod joins two external networks the infrastructure stacks
# create once per host: `traefik-public` (HTTPS ingress) and `monitoring`
# (Alloy's scrape fabric). Ingress and observability are opted into purely
# through labels, following services/traefik/README.md and
# services/monitoring/README.md there.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# Alloy tails every container carrying `logging: promtail`; `stackname` fills
# the Stack filter on the Log Search and Container Metrics dashboards.
x-common-labels: &default-labels
  logging: "promtail"
  stackname: "ais-tracker"

x-tracker-build: &tracker-build
  context: ..
  dockerfile: Dockerfile
  args:
    VERSION: ${VERSION:-dev}

services:
  postgres:
    build:
      context: ./postgres
    image: ais-tracker/postgres:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ais}
    # wal_level=logical + replication slots are required for the Phase 5 CDC
    # work; they must be set at postmaster start, not via SQL.
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    # Published on localhost only: dev connects from the host, while in prod the
    # other services reach Postgres over the internal network by service name.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata
    # ganymede is a shared 8 GB host with no swap; cap the stack so an ingest
    # spike can't push the other stacks into the OOM killer.
    mem_limit: ${POSTGRES_MEM_LIMIT:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ais} -d ${POSTGRES_DB:-ais}"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      <<: *default-labels
    logging: *default-logging
    networks:
      - internal

  # One-shot migrator: applies pending migrations, then exits 0. The tracker
  # waits for it to complete before starting.
  migrate:
    profiles: [prod]
    build: *tracker-build
    image: ais-tracker/tracker:latest
    restart: "no"
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ais}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ais}?sslmode=disable
      MIGRATIONS_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      <<: *default-labels
    logging: *default-logging
    networks:
      - internal

  tracker:
    profiles: [prod]
    build: *tracker-build
    image: ais-tracker/tracker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ais}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ais}?sslmode=disable
      APP_ENV: prod
      HTTP_PORT: "8080"
      LOG_FORMAT: json
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: ${TRACKER_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "/usr/local/bin/tracker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      <<: *default-labels

      # --- Traefik ingress: HTTPS on ais.roythan.de, Let's Encrypt via `le` ---
      # Router and service names are global across every stack on the shared
      # Traefik, hence the ais- prefix. /metrics stays off the public router;
      # Alloy scrapes it over the monitoring network instead.
      traefik.enable: "true"
      traefik.docker.network: "traefik-public"
      traefik.http.routers.ais-tracker.entrypoints: "https"
      traefik.http.routers.ais-tracker.rule: "Host(`${TRACKER_HOST:-ais.roythan.de}`) && !PathPrefix(`/metrics`)"
      traefik.http.routers.ais-tracker.tls: "true"
      traefik.http.routers.ais-tracker.tls.certresolver: "le"
      traefik.http.services.ais-tracker.loadbalancer.server.port: "8080"

      # --- Metrics: discovered by Alloy's Docker SD on the monitoring network ---
      prometheus.scrape: "true"
      prometheus.port: "8080"
      prometheus.job: "ais-tracker"
    logging: *default-logging
    networks:
      - internal
      - traefik-public
      - monitoring

  # Postgres metrics for Prometheus, complementing the tracker's own /metrics.
  postgres-exporter:
    profiles: [prod]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-ais}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ais}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      <<: *default-labels
      prometheus.scrape: "true"
      prometheus.port: "9187"
      prometheus.job: "ais-tracker-postgres"
    logging: *default-logging
    networks:
      - internal
      - monitoring

volumes:
  pgdata:

networks:
  internal:
  # Shared networks owned by the infrastructure repo (prod profile only):
  #   docker network create traefik-public
  #   docker network create monitoring
  traefik-public:
    external: true
  monitoring:
    external: true
